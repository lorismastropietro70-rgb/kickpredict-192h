    <script>
      // Gracefully silence harmless Vite WebSocket HMR errors in Cloud Run iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
