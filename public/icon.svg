<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#1E293B" stroke-width="3" />

  <!-- Neon accent circle glow -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#neonCyan)" stroke-width="4" opacity="0.4" filter="url(#glow)" />
  <circle cx="256" cy="230" r="110" fill="#0B132B" stroke="url(#neonEmerald)" stroke-width="5" />

  <!-- Stylized Football / Soccer geometric mesh inside -->
  <polygon points="256,180 290,205 277,245 235,245 222,205" fill="#10B981" />
  
  <!-- Seam lines -->
  <line x1="256" y1="180" x2="256" y2="135" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="290" y1="205" x2="330" y2="190" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="277" y1="245" x2="305" y2="280" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="235" y1="245" x2="207" y2="280" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="222" y1="205" x2="182" y2="190" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />

  <!-- Analytical 192h / HT Badge underneath -->
  <rect x="136" y="360" width="240" height="56" rx="28" fill="#111827" stroke="url(#neonEmerald)" stroke-width="2.5" />
  <text x="256" y="396" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="2">
    192H · HT
  </text>
  
  <!-- Small neon indicator dots -->
  <circle cx="166" cy="388" r="5" fill="#10B981" />
  <circle cx="346" cy="388" r="5" fill="#06B6D4" />
</svg>
